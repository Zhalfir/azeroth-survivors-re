<g transform="translate(0,228)"><rect width="484" height="76" rx="10" fill="#1d1c18" stroke="#854f0b" stroke-width="3"/><rect x="12" y="10" width="56" height="56" rx="8" fill="#993c1d"/><text x="84" y="34" font-size="26" fill="#f1efe8" font-weight="bold">Cleave</text><text x="84" y="62" font-size="20" fill="#b4b2a9">Rank 3 → 4</text></g>
</g>
